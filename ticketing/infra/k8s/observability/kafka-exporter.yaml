apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9308"
        linkerd.io/inject: "disabled"
    spec:
      initContainers:
        - name: wait-for-kafka
          image: apache/kafka:3.9.0
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for Kafka broker kafka-0.kafka-srv:9092 to accept client API queries..."
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-0.kafka-srv:9092 > /dev/null 2>&1; do
                echo "Kafka broker not ready yet. Retrying in 2 seconds..."
                sleep 2
              done
              echo "Kafka broker is fully ready to accept client connections!"
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.7.0
          args:
            - "--kafka.server=kafka-0.kafka-srv:9092"
          ports:
            - name: metrics
              containerPort: 9308
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter-srv
spec:
  selector:
    app: kafka-exporter
  ports:
    - name: metrics
      protocol: TCP
      port: 9308
      targetPort: 9308
