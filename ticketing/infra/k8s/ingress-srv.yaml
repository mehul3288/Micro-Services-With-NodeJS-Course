apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: global-rate-limit
  namespace: default
config:
  minute: 100
  policy: local
  fault_tolerant: true
  hide_client_headers: false
plugin: rate-limiting
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: auth-rate-limit
  namespace: default
config:
  minute: 10
  policy: local
  fault_tolerant: true
  hide_client_headers: false
plugin: rate-limiting
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: global-request-size-limit
  namespace: default
config:
  allowed_payload_size: 1
plugin: request-size-limiting
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: global-cors
  namespace: default
config:
  origins:
    - https://ticketing.dev
    - http://ticketing.dev
  methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  headers:
    - Accept
    - Accept-Version
    - Content-Length
    - Content-MD5
    - Content-Type
    - Date
    - X-Auth-Token
    - Authorization
  credentials: true
  max_age: 3600
plugin: cors
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-ingress-auth
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/plugins: "auth-rate-limit, global-request-size-limit, global-cors"
spec:
  ingressClassName: kong
  rules:
    - host: ticketing.dev
      http:
        paths:
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: auth-srv
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-ingress-main
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/plugins: "global-rate-limit, global-request-size-limit, global-cors"
spec:
  ingressClassName: kong
  rules:
    - host: ticketing.dev
      http:
        paths:
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: payments-srv
                port:
                  number: 3000
          - path: /api/tickets
            pathType: Prefix
            backend:
              service:
                name: tickets-srv
                port:
                  number: 3000
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: orders-srv
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-srv
                port:
                  number: 3000