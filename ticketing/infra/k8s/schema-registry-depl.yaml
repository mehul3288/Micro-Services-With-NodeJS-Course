apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry-depl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      initContainers:
        - name: wait-for-kafka
          image: apache/kafka:3.9.0
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for Kafka broker kafka-0.kafka-srv:9092 to be ready..."
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-0.kafka-srv:9092 > /dev/null 2>&1; do
                echo "Kafka broker not ready yet. Retrying in 2 seconds..."
                sleep 2
              done
              echo "Kafka broker is fully ready!"
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:7.6.0
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: "PLAINTEXT://kafka-0.kafka-srv:9092"
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:8081"
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC
              value: "_schemas"
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /subjects
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /subjects
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry-srv
spec:
  selector:
    app: schema-registry
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081
