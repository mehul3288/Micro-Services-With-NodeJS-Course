# ============================================================================
# Zero-Trust Database Isolation Policies (Linkerd Server & AuthorizationPolicy)
# ============================================================================
# Rule: Each MongoDB StatefulSet accepts connections ONLY from its authorized
# microservice ServiceAccount. Lateral movement from any other pod is blocked.
# ============================================================================

# --- 1. AUTH DATABASE ISOLATION ---
apiVersion: policy.linkerd.io/v1beta1
kind: Server
metadata:
  name: auth-mongo-27017
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: auth-mongo
  port: 27017
  proxyProtocol: opaque
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: auth-sa-auth
  namespace: default
spec:
  identities:
    - "auth-sa.default.serviceaccount.identity.linkerd.cluster.local"
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: auth-mongo-policy
  namespace: default
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: auth-mongo-27017
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: auth-sa-auth
---

