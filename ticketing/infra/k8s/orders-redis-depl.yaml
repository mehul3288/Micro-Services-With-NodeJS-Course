apiVersion: v1
kind: Service
metadata:
  name: orders-redis-srv
spec:
  selector:
    app: orders-redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-redis-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-redis
  template:
    metadata:
      labels:
        app: orders-redis
    spec:
      containers:
        - name: orders-redis
          image: redis:7-alpine
          args: ["redis-server", "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
